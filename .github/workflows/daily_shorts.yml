name: daily-shorts-pipeline

on:
  schedule:
    # UTC 0,9,12시 = 한국시간(KST) 오전 9시 / 오후 6시 / 오후 9시
    - cron: "0 0,9,12 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼 (테스트/디버깅용)

jobs:
  # --- 1~5단계: 사연 가져오기부터 영상 조립까지. 여기까진 완전 자동. ---
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg 및 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: "1단계: 구글시트에서 사연 가져오기"
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python fetch_script.py

      - name: "4단계: 음성/이미지 생성"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generate_media.py

      - name: "5단계: 영상 조립 (ffmpeg)"
        run: python assemble_video.py

      - name: 산출물 전달 (다음 단계 + 미리보기용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: 빌드 실패 알림 (Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: 영상 제작(build) 단계 실패. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

  # --- 6단계: YouTube 업로드. 사람이 GitHub에서 승인해야 이 job이 시작된다. ---
  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: youtube-upload

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 의존성 설치 (업로드에 필요한 것만)
        run: pip install google-auth-oauthlib google-api-python-client requests Pillow

      - name: build job 산출물 받기
        uses: actions/download-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: output/

      - name: 시크릿 -> 파일 복원 (YouTube 인증)
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json

      - name: "6단계: YouTube 업로드"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python upload_video.py

      - name: 업로드 실패 알림 (Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: YouTube 업로드(upload) 단계 실패. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
